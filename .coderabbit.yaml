# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-US"
tone_instructions: ""
early_access: false
enable_free_tier: true

reviews:
  profile: "chill"
  auto_review:
    enabled: true
    auto_incremental_review: false
    ignore_title_keywords: []
    labels: []
    drafts: false
    base_branches:
      - ".*"
    ignore_usernames: []
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_instructions: ""
  high_level_summary_placeholder: "@coderabbitai summary"
  high_level_summary_in_walkthrough: false
  review_status: true
  review_details: true
  commit_status: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  suggested_reviewers: true
  auto_apply_labels: false
  auto_assign_reviewers: false
  path_filters:
    - "!**/bin/**"
    - "!**/obj/**"
    - "!**/Migrations/**"
  path_instructions: []
  in_progress_fortune: true
  poem: false
  enable_prompt_for_ai_agents: true
  pre_merge_checks: {}
  tools:
    phpstan:
      enabled: true
    phpmd:
      enabled: true

chat:
  art: true
  auto_reply: true
  integrations:
    jira:
      usage: "auto"
    linear:
      usage: "auto"

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
  learnings:
    scope: "auto"
  issues:
    scope: "auto"
  pull_requests:
    scope: "auto"

code_generation:
  docstrings:
    language: "en-US"

issue_enrichment:
  auto_enrich:
    enabled: false
  planning:
    enabled: true
    auto_planning:
      enabled: true
  labeling:
    labeling_instructions: []
    auto_apply_labels: false
