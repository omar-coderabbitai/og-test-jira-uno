# ==============================================================================
# CHAT CONFIGURATION
# ==============================================================================
chat:
  # Generate ASCII/emoji art in chat responses
  art: true

  # Auto-reply to messages without requiring @coderabbitai mention
  auto_reply: true

  # External integrations
  integrations:
    # Jira integration: "auto", "enabled", or "disabled"
    jira:
      usage: "auto"

    # Linear integration: "auto", "enabled", or "disabled"
    linear:
      usage: "auto"

# ==============================================================================
# KNOWLEDGE BASE
# ==============================================================================
knowledge_base:
  # Opt out of data retention (zero data storage)
  opt_out: false

  # Enable web search for additional context
  web_search:
    enabled: true

  # Learn from organization's code guidelines
  code_guidelines:
    enabled: true

  # Learnings scope: "local" (repo only), "global" (org-wide), "auto"
  learnings:
    scope: "auto"

  # Git platform issue scope
  issues:
    scope: "auto"

  # Jira integration configuration
  # jira:
  #   project_keys: []

  # Linear integration configuration
  # linear:
  #   team_keys: []

  # Pull requests scope
  pull_requests:
    scope: "auto"

  # MCP (Model Context Protocol) server integration
  # mcp:
  #   disabled_servers: []

# ==============================================================================
# CODE GENERATION
# ==============================================================================
code_generation:
  # Docstrings generation
  docstrings:
    # Language for generated docstrings (ISO language code)
    language: "en-US"

    # File-specific docstring guidelines
    # path_instructions:
    #   - path: "src/**/*.py"
    #     instructions: "Use Google-style docstrings"

  # Unit tests generation
  # unit_tests:
  #   path_instructions:
  #     - path: "src/**/*.ts"
  #       instructions: "Use Jest for testing with TypeScript"

# ==============================================================================
# ISSUE ENRICHMENT
# ==============================================================================
issue_enrichment:
  # Automatically enrich issues when created/updated
  auto_enrich:
    enabled: false

  # Plan generation for issues
  planning:
    enabled: true
    # Automatically generate plans based on labels
    auto_planning:
      enabled: true
      labels: []  # Trigger planning via these labels

  # Label management
  labeling:
    # Custom label guidelines (array of objects with label and instructions)
    labeling_instructions: []
    # Example:
    # - label: "bug"
    #   instructions: "Apply to defects and errors"

    # Automatically apply suggested labels to issues
    auto_apply_labels: false
